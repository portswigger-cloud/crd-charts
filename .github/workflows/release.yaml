name: Fetch and Release Charts

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - helmfile.yaml

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed by git-auto-commit and chart-releaser
      packages: write   # needed for OCI push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Helmfile
        uses: mamezou-tech/setup-helmfile@v2.2.0
        with:
          helmfile-version: "v0.150.0"
          helm-version: "v3.11.0"
          helm-diff-plugin-version: "v3.9.14"
          kubectl-version: "1.24.7"
          kubectl-release-date: "2022-10-31"

      - name: Create CRD charts
        env:
          DOWNLOAD_PATH: "work"
        run: |
          rm -rf charts
          helmfile repos
          for release in $(helmfile list --skip-charts --output json | jq -r '.[].name')
          do
            rm -rf ${DOWNLOAD_PATH}
            helmfile fetch --skip-deps --concurrency=1 -l name=${release} --output-dir ${DOWNLOAD_PATH} --output-dir-template ${DOWNLOAD_PATH} ; helmfile lint --skip-deps --concurrency=1 -l name=${release}
          done

      - uses: stefanzweifel/git-auto-commit-action@v7

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_SKIP_EXISTING: "true"
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # Migration: charts are published to GHCR (OCI) alongside GitHub Pages
      # while consumers move over. Remove the chart-releaser step once nothing
      # references the Pages URL.
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_USER" --password-stdin

      - name: Package and push charts to GHCR (OCI)
        run: |
          set -euo pipefail
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/crd-charts"
          mkdir -p .cr-release-packages-oci
          for chart_dir in charts/*/; do
            name=$(basename "$chart_dir")
            version=$(awk '/^version:/{print $2}' "${chart_dir}Chart.yaml" | tr -d '"')
            # Mirror CR_SKIP_EXISTING: don't republish a version that is already there
            if helm show chart "${registry}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "Skipping ${name}:${version}, already published"
              continue
            fi
            helm package "$chart_dir" -d .cr-release-packages-oci
          done
          for pkg in .cr-release-packages-oci/*.tgz; do
            [ -e "$pkg" ] || continue
            helm push "$pkg" "$registry"
          done
